# Optional free lobby deployment. Does not create a service until you deploy it.
# GitHub Pages continues to host the public frontend.
services:
  - type: web
    name: retro-room-lobby
    runtime: docker
    repo: https://github.com/Axel-NL94/retro-room
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: ALLOWED_ORIGINS
        value: https://axel-nl94.github.io
